<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل تنزيل نظام Onyx</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16302b;--mut:#5d7570;--line:#d5dedb;--acc:#0f6b5c;--acc2:#e7f3f0;--warn:#b7791f;--code:#10231f;--codeink:#c9efe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#15251f;--ink:#e3f0ec;--mut:#8fa9a3;--line:#284039;--acc:#3fbfa6;--acc2:#183a33;--warn:#e0a84a;--code:#0a1412;--codeink:#b4e8da}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#15251f;--ink:#e3f0ec;--mut:#8fa9a3;--line:#284039;--acc:#3fbfa6;--acc2:#183a33;--warn:#e0a84a;--code:#0a1412;--codeink:#b4e8da}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0;font-weight:600;margin-inline-end:auto}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;max-width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:18px;padding:18px;max-width:1150px;margin:auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
nav .grp{font-weight:600;margin:14px 0 4px;color:var(--mut);font-size:13px}
nav button{display:block;width:100%;text-align:start;margin-bottom:5px;border-radius:6px}
nav button.on{background:var(--acc2);border-color:var(--acc)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}
.vars label{font-size:13px;color:var(--mut);display:block}.vars input{width:100%;direction:ltr;text-align:left}
h2{font-size:17px;margin:0 0 10px}
.step{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.step.done{border-inline-start-color:var(--acc);opacity:.75}
.top{display:flex;gap:10px;align-items:flex-start}.top input{margin-top:6px;width:18px;height:18px;accent-color:var(--acc)}
.tag{font-size:12px;background:var(--acc2);color:var(--acc);border-radius:4px;padding:0 7px;margin-inline-start:8px;white-space:nowrap}
.step p{margin:2px 0 8px;color:var(--mut)}
pre{direction:ltr;text-align:left;background:var(--code);color:var(--codeink);border-radius:6px;padding:10px 12px;margin:0 0 8px;overflow-x:auto;font:13px/1.55 Consolas,"Courier New",monospace;white-space:pre}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}textarea{width:100%;height:36px;resize:vertical}
.msg{color:var(--mut)}
a.dlb{background:var(--acc);color:#fff;border-radius:6px;padding:5px 14px;text-decoration:none}a.dlb:hover{opacity:.9}
.grpbox{margin-bottom:10px}.grpbox>summary{cursor:pointer;color:var(--mut);padding:6px 2px;font-size:13px;list-style:none}.grpbox>summary::-webkit-details-marker{display:none}.grpbox>summary:before{content:'▸ ';color:var(--acc)}.grpbox[open]>summary:before{content:'▾ '}.grpbox .step{margin-inline-start:6px}
.gal{display:flex;flex-direction:column;gap:12px;margin-top:8px}.gal figure{margin:0}.gal img{max-width:100%;border:1px solid var(--line);border-radius:6px;display:block}.gal figcaption{font-size:12px;color:var(--mut);margin-top:4px}
</style>
</head>

function allInOneBat(v){
 const dest=fill(v.src,v);
 let b=`@echo off\r\nsetlocal\r\nset "DEST=${dest}"\r\nset "RAR=C:\\Program Files\\WinRAR\\WinRAR.exe"\r\nif not exist "%RAR%" set "RAR=C:\\Program Files (x86)\\WinRAR\\WinRAR.exe"\r\nif not exist "%DEST%" mkdir "%DEST%"\r\necho === Downloading files to %DEST% ===\r\n`;
 DL_ITEMS.forEach(([name,url])=>{b+=`echo - ${name}\r\ncurl -L -o "%DEST%\\${name}" "${url}"\r\n`});
 b+=`echo === Extracting archives ===\r\nif not exist "%RAR%" (\r\n  echo WinRAR not found, skipping extraction. Please extract manually.\r\n  goto :end\r\n)\r\nfor %%f in ("%DEST%\\*.rar") do (\r\n  echo - %%~nxf\r\n  "%RAR%" x -y -ibck "%%f" "%DEST%\\%%~nf\\"\r\n)\r\n:end\r\necho Done.\r\npause\r\n`;
 return b;
}

 S('man','استخراج ملف Oracle 12c Batch','داخل نفس المجلد يوجد ملف مضغوط باسم "Oracle 12c Batch". اضغط الزر لاستخراجه هناك مباشرة.','','','EXTRACTNAMED','',R`{{src}}\Oracle12.1`,'Oracle 12c Batch.*'),
 S('man','استخراج ملف الباتش (23179016)','داخل Oracle 12c Batch\\Fix_Oracle_12C_Issue يوجد ملف الباتش p23179016_121020_MSWIN-x86-64. اضغط الزر لاستخراجه فيصير مجلد الباتش 23179016 جاهزاً.','','','EXTRACTNAMED','',R`{{src}}\Oracle12.1\Oracle 12c Batch\Fix_Oracle_12C_Issue`,'p23179016_121020_MSWIN-x86-64.*'),

let DB={};let cur=null;let sec='a';
try{DB=JSON.parse(localStorage.getItem('onyx_db')||'{}');cur=localStorage.getItem('onyx_cur')}catch(e){}
const save=()=>{try{localStorage.setItem('onyx_db',JSON.stringify(DB));localStorage.setItem('onyx_cur',cur||'')}catch(e){}};
Object.values(DB).forEach(c=>{c.v=c.v||{};VARS.forEach(([k,l,d])=>{if(c.v[k]===undefined)c.v[k]=d});if(/Setup/.test(c.v.src))c.v.src=R`D:\tools`;if(/^D:\\(oracle|App)\\product/.test(c.v.home)||/db_home$/.test(c.v.home))c.v.home=R`D:\App\{{user_name}}\product\db_home_1`});save();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fill(s,v){for(let i=0;i<3;i++)s=s.replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k]||m);return s}
const stepId=(s,i)=>s.id+i;
function render(){
 const names=Object.keys(DB);
 $('cl').innerHTML=names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
 if(!cur||!DB[cur]){$('vars').innerHTML='';$('nav').innerHTML='';$('main').innerHTML='<p class="msg">لا يوجد عملاء بعد. اضغط «عميل جديد» للبدء.</p>';return}
 const c=DB[cur];
 $('vars').innerHTML=VARS.map(([k,l])=>`<div><label>${l}</label><input data-v="${k}" value="${esc(c.v[k]||'')}"></div>`).join('')+DEVUI;
 let last='',h='';let all=0,alld=0;
 SECTIONS.forEach(s=>{const d=s.steps.filter((x,i)=>c.d[stepId(s,i)]).length;all+=s.steps.length;alld+=d;
  if(s.g!==last){h+=`<div class="grp">${s.g}</div>`;last=s.g}
  h+=`<button data-s="${s.id}" class="${s.id===sec?'on':''}">${s.t} <span class="msg">(${d}/${s.steps.length})</span><div class="bar"><i style="width:${d/s.steps.length*100}%"></i></div></button>`});
 $('nav').innerHTML=`<div class="grp">التقدم الكلي: ${alld}/${all}</div><div class="bar" style="margin-bottom:8px"><i style="width:${alld/all*100}%"></i></div>`+h;
 const s=SECTIONS.find(x=>x.id===sec);
 const stepHTML=(x,i)=>{const id=stepId(s,i),dn=!!c.d[id];
  return `<div class="step ${dn?'done':''}"><div class="top"><input type="checkbox" data-d="${id}" ${dn?'checked':''} aria-label="تم"><div style="flex:1"><b>${esc(x.t)}</b><span class="tag">${TYPES[x.k]}</span>${x.d?`<p>${esc(fill(x.d,c.v))}</p>`:''}${x.code?`<pre>${esc(fill(x.code,c.v))}</pre><div class="row"><button data-c="${i}">نسخ الكود</button></div>`:''}${x.b==='GALLERY'?`<details class="grpbox"><summary>عرض صور التثبيت (10) — اضغط لإظهارها</summary><div class="gal">${ORACLE_INSTALL_IMGS.map((im,gi)=>`<figure><img loading="lazy" src="${im}" alt="خطوة ${gi+1}"><figcaption>خطوة ${gi+1} من 10</figcaption></figure>`).join('')}</div></details>`:x.b==='ALLINONE'?`<div class="row" style="margin-bottom:8px"><button class="p" data-all="${i}">تنزيل سكربت all-in-one.bat</button></div>`:x.b==='EXTRACTONLY'?`<div class="row" style="margin-bottom:8px"><button class="p" data-ext="${i}">تنزيل سكربت فك الضغط</button></div>`:x.b==='EXTRACTNAMED'?`<div class="row" style="margin-bottom:8px"><button class="p" data-xn="${i}">تنزيل سكربت الاستخراج</button></div>`:x.b==='OPENFILE'?`<div class="row" style="margin-bottom:8px"><button class="p" data-of="${i}">تنزيل سكربت فتح الملف</button></div>`:x.b==='TNSNAMES_OFFLINE'?'':x.b?`<div class="row" style="margin-bottom:8px"><button class="p" data-b="${i}">إنشاء المجلد</button></div>`:''}${x.b==='TNSNAMES_OFFLINE'?`<div class="row" style="margin:6px 0"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-offline ${c.v.offline?'checked':''}> إضافة نقطة أوفلاين (فرع آخر)</label></div><div style="${c.v.offline?'':'display:none'}"><input type="text" data-servername placeholder="اسم السيرفر" value="${esc(c.v.server_name||'')}" style="width:100%;margin-bottom:6px;direction:ltr;text-align:left"><pre>${esc(fill(R`Yemensoft_brn =
  (DESCRIPTION =
    (ADDRESS = (PROTOCOL = TCP)(HOST = {{server_name}})(PORT = {{port}}))
    (CONNECT_DATA =
      (SERVER = DEDICATED)
      (SERVICE_NAME = orcl)
    )
  )`,c.v))}</pre><div class="row"><button data-c2="${i}">نسخ كود الأوفلاين</button></div></div>`:''}${x.u?`<div class="row" style="margin-bottom:8px"><a class="dlb" href="${x.u}" target="_blank" rel="noopener">فتح رابط التنزيل</a></div>`:''}<textarea data-n="${id}" placeholder="ملاحظات">${esc(c.n[id]||'')}</textarea></div></div></div>`};
 let mh='',gi=0;
 while(gi<s.steps.length){const x=s.steps[gi];
  if(x.grp){let gj=gi,buf='';while(gj<s.steps.length&&s.steps[gj].grp===x.grp){buf+=stepHTML(s.steps[gj],gj);gj++}
   const dn2=s.steps.slice(gi,gj).filter((_,k)=>c.d[stepId(s,gi+k)]).length;
   mh+=`<details class="grpbox"><summary>روابط التنزيل الفردية (${dn2}/${gj-gi}) — اضغط لإظهارها عند الحاجة</summary>${buf}</details>`;
   gi=gj;
  }else{mh+=stepHTML(x,gi);gi++}}
 $('main').innerHTML=`<h2>${s.t}</h2>`+mh;
}
document.addEventListener('change',e=>{const t=e.target,c=DB[cur];if(!c)return;
 if(t.dataset.offline!==undefined){c.v.offline=t.checked;save();render()}
 else if(t.dataset.servername!==undefined){c.v.server_name=t.value.trim();save();render()}
 else if(t.dataset.d){c.d[t.dataset.d]=t.checked;save();render()}
 else if(t.dataset.n){c.n[t.dataset.n]=t.value;save()}
 else if(t.dataset.v){c.v[t.dataset.v]=t.value.trim();save();render()}
 else if(t.id==='cl'){cur=t.value;save();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.s){sec=t.dataset.s;render()}
 if(t.dataset.dev==='1'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([DEVBAT.replace(/\n/g,'\r\n')],{type:'application/octet-stream'}));a.download='device-info.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.dev==='2'){const c=DB[cur];
  const bad=()=>alert('لم أجد معلومات الجهاز في الحافظة. شغّل device-info.bat أولاً ثم اضغط لصق.');
  if(!navigator.clipboard||!navigator.clipboard.readText){bad();return}
  navigator.clipboard.readText().then(x=>{const p=x.trim().split('|');if(p.length<3||!p[0]){bad();return}
   c.v.ip=p[0].trim();c.v.host=p[1].trim();c.v.user_name=p[2].trim();save();render()},bad)}
 if(t.dataset.xn!==undefined){const st=SECTIONS.find(x=>x.id===sec).steps[+t.dataset.xn];const txt=extractNamedBat(DB[cur].v,st.xdir,st.xpat);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='extract-step.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.of!==undefined){const st=SECTIONS.find(x=>x.id===sec).steps[+t.dataset.of];const txt=openFileBat(DB[cur].v,st.xdir);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='open-setup.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.ext!==undefined){const txt=extractOnlyBat(DB[cur].v);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='extract-only.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.all!==undefined){const txt=allInOneBat(DB[cur].v);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='all-in-one.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.b!==undefined){const s=SECTIONS.find(x=>x.id===sec);const txt=fill(s.steps[+t.dataset.b].b,DB[cur].v).replace(/\n/g,'\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='create-folder.bat';document.body.appendChild(a);a.click();a.remove()}
 if(t.dataset.c2!==undefined){const txt=fill(R`Yemensoft_brn =
  (DESCRIPTION =
    (ADDRESS = (PROTOCOL = TCP)(HOST = {{server_name}})(PORT = {{port}}))
    (CONNECT_DATA =
      (SERVER = DEDICATED)
      (SERVICE_NAME = orcl)
    )
  )`,DB[cur].v);
  const ok=()=>{t.textContent='تم النسخ';setTimeout(()=>t.textContent='نسخ كود الأوفلاين',1200)};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>{});else ok()}
 if(t.dataset.c!==undefined){const s=SECTIONS.find(x=>x.id===sec);const txt=fill(s.steps[+t.dataset.c].code,DB[cur].v);
  const ok=()=>{t.textContent='تم النسخ';setTimeout(()=>t.textContent='نسخ الكود',1200)};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>{});else ok()}});
$('add').onclick=()=>{const n=(prompt('اسم العميل الجديد')||'').trim();if(!n||DB[n])return;
 const v={};VARS.forEach(([k,l,d])=>v[k]=d);v.client=n;DB[n]={v,d:{},n:{}};cur=n;sec='a';save();render()};
$('del').onclick=()=>{if(cur&&confirm('حذف العميل «'+cur+'» وكل تقدمه؟')){delete DB[cur];cur=Object.keys(DB)[0]||null;save();render()}};
render();
</script>
